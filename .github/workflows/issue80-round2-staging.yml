name: issue80-round2-staging
on:
  push:
    branches:
      - tmp/issue80-kody-round2
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Issue 80 Kody round 2 fix
        shell: bash
        run: |
          set -euo pipefail
          git apply .issue80-round2.patch
          rm -f .issue80-round2.patch .github/workflows/issue80-round2-staging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bound Writer composition lock artifacts"
          git push
