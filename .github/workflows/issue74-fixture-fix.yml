name: issue74-fixture-fix

on:
  push:
    branches: [tmp/issue74-fixture-fix]

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-74-profile-state-validation
      - name: Diagnose AR-CAP digests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('core/fixtures/conversation/valid/generic-conversation-flow.json').read_text())
          receipt = next(d for d in data['documents'] if d.get('action_receipt_id') == 'AR-CAP')
          def walk(value, path='AR-CAP'):
              if isinstance(value, dict):
                  for k, v in value.items(): walk(v, f'{path}.{k}')
              elif isinstance(value, list):
                  for i, v in enumerate(value): walk(v, f'{path}[{i}]')
              elif isinstance(value, str) and value.startswith('sha256:'):
                  print(f'{path}: len={len(value)} hex={len(value)-7} value={value}')
          walk(receipt)
          PY
