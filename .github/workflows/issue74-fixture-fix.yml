name: issue74-fixture-fix

on:
  push:
    branches: [tmp/issue74-fixture-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-74-profile-state-validation
          fetch-depth: 0
      - name: Patch exact AR-CAP state digest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('core/fixtures/conversation/valid/generic-conversation-flow.json')
          raw = p.read_text(encoding='utf-8')
          data = json.loads(raw)
          matches = [d for d in data['documents'] if d.get('action_receipt_id') == 'AR-CAP']
          if len(matches) != 1:
              raise SystemExit(f'expected one AR-CAP receipt, found {len(matches)}')
          old = 'sha256:' + '8' * 61
          new = 'sha256:' + '8' * 64
          receipt = matches[0]
          if receipt['state_after']['content_digest'] != old:
              raise SystemExit('AR-CAP state_after digest does not match expected 61-digit broken value')
          needle = '"state_after":{"state_id":"STATE-8","revision":8,"content_digest":"' + old + '"}'
          replacement = '"state_after":{"state_id":"STATE-8","revision":8,"content_digest":"' + new + '"}'
          if raw.count(needle) != 1:
              raise SystemExit(f'expected one exact AR-CAP serialized state_after, found {raw.count(needle)}')
          p.write_text(raw.replace(needle, replacement), encoding='utf-8')
          PY
          git diff --check
          git diff --exit-code -- . ':(exclude)core/fixtures/conversation/valid/generic-conversation-flow.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/fixtures/conversation/valid/generic-conversation-flow.json
          git commit -m 'Fix action receipt state digest fixture'
          git push origin HEAD:fix/issue-74-profile-state-validation
