name: bootstrap completed Run replay import fix

on:
  push:
    branches:
      - fix/completed-run-replay

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/completed-run-replay
          fetch-depth: 0
      - name: Apply import fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('plugins/local_application/external_desktop_facade.py')
          text = path.read_text()
          old = "    DesktopResearchExternalAdapter,\n    reconstruct_attempts,\n)"
          new = "    DesktopResearchExternalAdapter,\n)\nfrom plugins.desktop_research.attempts import reconstruct_attempts"
          if old not in text:
              raise SystemExit('expected replay import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/replay-fix.patch
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix completed Run replay attempt import"
          git push origin HEAD:fix/completed-run-replay
