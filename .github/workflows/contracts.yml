name: contract-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment with developer tools
        run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run --frozen --group dev ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen --group dev ruff format --check .
      - name: Mypy (core, strict)
        run: uv run --frozen --group dev mypy

  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen --group coverage
      - name: Smoke production repository launcher
        run: ./research-loom --help
      - name: Compare launcher, direct and console-script invocation errors
        shell: bash
        run: |
          set +e
          ./research-loom invalid-command > launcher.stdout 2> launcher.stderr
          launcher_exit=$?
          uv run --frozen python research-loom invalid-command > direct.stdout 2> direct.stderr
          direct_exit=$?
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/.venv/bin/research-loom" invalid-command) > script.stdout 2> script.stderr
          script_exit=$?
          set -e
          test "$launcher_exit" -eq "$direct_exit"
          test "$launcher_exit" -eq "$script_exit"
          cmp launcher.stdout direct.stdout
          cmp launcher.stderr direct.stderr
          cmp launcher.stdout script.stdout
          cmp launcher.stderr script.stderr
      - name: Run canonical contract tests
        env:
          COVERAGE_FILE: coverage.contracts
        run: uv run --frozen coverage run -m unittest discover -t . -s tests/contracts -p 'test_*.py' -v
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-contracts
          # One data file per process: the test run and each Python subprocess.
          path: coverage.contracts.*
          if-no-files-found: error
          retention-days: 7

  runtime-linux:
    name: runtime-linux-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen --group coverage
      - name: Run Research State runtime tests shard ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t modules < <(uv run --frozen python scripts/ci_test_shards.py select \
            --platform linux --shards 4 --index ${{ matrix.shard }} | tr -d '\r')
          test "${#modules[@]}" -gt 0
          printf 'Shard ${{ matrix.shard }}/4: %s modules\n' "${#modules[@]}"
          printf '  %s\n' "${modules[@]}"
          uv run --frozen coverage run -m unittest -v "${modules[@]}"
        env:
          COVERAGE_FILE: coverage.shard-${{ matrix.shard }}
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage.shard-${{ matrix.shard }}.*
          if-no-files-found: error
          retention-days: 7

  coverage-report:
    # Report-only coverage baseline (#507); it never fails the build.
    name: coverage-report
    needs: [contract-checks, runtime-linux, runtime-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen --group coverage
      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine and report coverage
        # A broken report must not turn the build red; the step shows as failed in the log.
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          data=(coverage.contracts.* coverage.shard-* coverage.windows-*)
          if [ "${#data[@]}" -eq 0 ]; then
            echo "No coverage data was uploaded; skipping the report." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run --frozen coverage combine "${data[@]}"
          uv run --frozen coverage report --format=total > coverage-total.txt
          {
            echo "## Coverage (report only)"
            echo
            echo "Combined from ${#data[@]} data files of the contract, Linux and Windows jobs (a failed job uploads no data)."
            echo
            echo "Total branch coverage: $(cat coverage-total.txt)%"
            echo
            uv run --frozen coverage report --format=markdown --sort=cover
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen coverage xml -o coverage.xml
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  runtime-windows:
    name: runtime-windows-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen --group coverage
      - name: Smoke production Windows launcher
        run: .\research-loom.cmd --help
      # Modules opt in with CI_WINDOWS = True; see scripts/ci_test_shards.py.
      - name: Run Windows-sensitive tests shard ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t modules < <(uv run --frozen python scripts/ci_test_shards.py select \
            --platform windows --shards 4 --index ${{ matrix.shard }} | tr -d '\r')
          test "${#modules[@]}" -gt 0
          printf 'Shard ${{ matrix.shard }}/4: %s modules\n' "${#modules[@]}"
          printf '  %s\n' "${modules[@]}"
          uv run --frozen coverage run -m unittest -v "${modules[@]}"
        env:
          COVERAGE_FILE: coverage.windows-${{ matrix.shard }}
      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-windows-${{ matrix.shard }}
          path: coverage.windows-${{ matrix.shard }}.*
          if-no-files-found: error
          retention-days: 7

  windows-misco-migration:
    name: windows-misco-migration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Smoke production Windows launcher
        run: .\research-loom.cmd --help
      - name: Parse deterministic MISCO migration PowerShell
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/migrations/misco/Invoke-Probe2ProfileMigration.ps1',
            'scripts/migrations/misco/New-MiscoMigrationProbe.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Run durable MISCO migration probe and exact NOOP rerun
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $workspace = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'loom-workspaces\probes\misco-profile-migration'
          .\scripts\migrations\misco\New-MiscoMigrationProbe.ps1 -ExpectedHead $head -Workspace $workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\migrations\misco\New-MiscoMigrationProbe.ps1 -ExpectedHead $head -Workspace $workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
