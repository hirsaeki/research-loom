name: contract-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - name: Install contract-test dependencies
        run: python -m pip install --disable-pip-version-check -r tests/contracts/requirements.txt
      - name: Run canonical contract tests
        run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
