name: contract-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Smoke production repository launcher
        run: ./research-loom --help
      - name: Compare launcher and direct developer invocation errors
        shell: bash
        run: |
          set +e
          ./research-loom invalid-command > launcher.stdout 2> launcher.stderr
          launcher_exit=$?
          uv run --frozen python research-loom invalid-command > direct.stdout 2> direct.stderr
          direct_exit=$?
          set -e
          test "$launcher_exit" -eq "$direct_exit"
          cmp launcher.stdout direct.stdout
          cmp launcher.stderr direct.stderr
      - name: Run canonical contract tests
        run: uv run --frozen python -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - name: Run Issue 158 external material health acceptance
        run: uv run --frozen python -m unittest discover -s tests/runtime -p 'test_external_material_health.py' -v
      - name: Run Issue 128 Profile generation advancement acceptance
        run: uv run --frozen python -m unittest discover -s tests/runtime -p 'test_profile_generation_advancement*.py' -v
      - name: Run Research State runtime tests
        run: uv run --frozen python -m unittest discover -s tests/runtime -p 'test_*.py' -v


