name: contract-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment with developer tools
        run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run --frozen --group dev ruff check --output-format=github .
      - name: Ruff format
        run: uv run --frozen --group dev ruff format --check .
      - name: Mypy (core, strict)
        run: uv run --frozen --group dev mypy

  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Smoke production repository launcher
        run: ./research-loom --help
      - name: Compare launcher and direct developer invocation errors
        shell: bash
        run: |
          set +e
          ./research-loom invalid-command > launcher.stdout 2> launcher.stderr
          launcher_exit=$?
          uv run --frozen python research-loom invalid-command > direct.stdout 2> direct.stderr
          direct_exit=$?
          set -e
          test "$launcher_exit" -eq "$direct_exit"
          cmp launcher.stdout direct.stdout
          cmp launcher.stderr direct.stderr
      - name: Run canonical contract tests
        run: uv run --frozen python -m unittest discover -t . -s tests/contracts -p 'test_*.py' -v

  runtime-linux:
    name: runtime-linux-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Run Research State runtime tests shard ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t modules < <(uv run --frozen python scripts/ci_test_shards.py select \
            --platform linux --shards 4 --index ${{ matrix.shard }} | tr -d '\r')
          test "${#modules[@]}" -gt 0
          printf 'Shard ${{ matrix.shard }}/4: %s modules\n' "${#modules[@]}"
          printf '  %s\n' "${modules[@]}"
          uv run --frozen python -m unittest -v "${modules[@]}"

  runtime-windows:
    name: runtime-windows-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Smoke production Windows launcher
        run: .\research-loom.cmd --help
      # Modules opt in with CI_WINDOWS = True; see scripts/ci_test_shards.py.
      - name: Run Windows-sensitive tests shard ${{ matrix.shard }}
        shell: bash
        run: |
          mapfile -t modules < <(uv run --frozen python scripts/ci_test_shards.py select \
            --platform windows --shards 4 --index ${{ matrix.shard }} | tr -d '\r')
          test "${#modules[@]}" -gt 0
          printf 'Shard ${{ matrix.shard }}/4: %s modules\n' "${#modules[@]}"
          printf '  %s\n' "${modules[@]}"
          uv run --frozen python -m unittest -v "${modules[@]}"

  windows-misco-migration:
    name: windows-misco-migration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Smoke production Windows launcher
        run: .\research-loom.cmd --help
      - name: Parse deterministic MISCO migration PowerShell
        shell: pwsh
        run: |
          foreach ($path in @(
            'projects/misco-ai-2026/Invoke-Probe2ProfileMigration.ps1',
            'projects/misco-ai-2026/New-MiscoMigrationProbe.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }
      - name: Run durable MISCO migration probe and exact NOOP rerun
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $workspace = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'loom-workspaces\probes\misco-profile-migration'
          .\projects\misco-ai-2026\New-MiscoMigrationProbe.ps1 -ExpectedHead $head -Workspace $workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\projects\misco-ai-2026\New-MiscoMigrationProbe.ps1 -ExpectedHead $head -Workspace $workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
