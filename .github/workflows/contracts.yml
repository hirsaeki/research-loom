name: contract-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  TZ: UTC
  LC_ALL: C.UTF-8
  LANG: C.UTF-8

jobs:
  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Smoke production CLI launcher
        run: uv run --frozen python research-loom --help
      - name: Run canonical contract tests
        run: uv run --frozen python -m unittest discover -s tests/contracts -p 'test_*.py' -v
      - name: Run Research State runtime tests
        run: uv run --frozen python -m unittest discover -s tests/runtime -p 'test_*.py' -v
