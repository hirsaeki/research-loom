name: contract-checks

on:
  pull_request:
    paths:
      - 'core/**'
      - 'profiles/**'
      - 'tests/contracts/**'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'profiles/**'
      - 'tests/contracts/**'
      - '.github/workflows/contracts.yml'

permissions:
  contents: read

jobs:
  contract-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - name: Install contract-test dependencies
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Run canonical contract tests
        run: python -m unittest discover -s tests/contracts -p 'test_*.py' -v
