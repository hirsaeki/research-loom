name: issue80-round3-staging
on:
  push:
    branches: ['tmp/issue80-kody-round3']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Issue 80 Kody round 3 fix
        shell: bash
        run: |
          set -euo pipefail
          git apply .issue80-round3.patch
          rm -f .issue80-round3.patch .github/workflows/issue80-round3-staging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Serialize Writer capture lock handoff"
          git push
