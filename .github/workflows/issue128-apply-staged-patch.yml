name: issue128-apply-staged-patch

on:
  push:
    branches: [issue-128-profile-advancement-staging]
    paths:
      - '.issue128-payload/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .issue128-payload/part00.b64 .issue128-payload/part01.b64 .issue128-payload/part02.b64 > /tmp/issue128.patch.gz.b64
          base64 -d /tmp/issue128.patch.gz.b64 > /tmp/issue128.patch.gz
          echo 'c2dbd9f75d0431b0416738731483ef2491e09599e0019d9de5248bd20f5442d7  /tmp/issue128.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue128.patch.gz > /tmp/issue128.patch
          echo '4b161db2631919dbb8cddf0de879a6d922146a710e8b50650f40edb476c183e5  /tmp/issue128.patch' | sha256sum -c -
      - name: Apply one logical commit to final branch
        shell: bash
        run: |
          git fetch origin main issue-128-profile-advancement
          git checkout -B issue-128-profile-advancement origin/main
          git apply --index --exclude='.github/workflows/contracts.yml' /tmp/issue128.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add explicit Project/Profile generation advancement'
          git push origin HEAD:issue-128-profile-advancement
