name: issue128-apply-staged-patch

on:
  push:
    branches: [issue-128-profile-advancement-staging]
    paths:
      - '.issue128-payload/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct and verify Windows fix patch
        shell: bash
        run: |
          base64 -d .issue128-payload/windows-fix.b64 > /tmp/issue128-windows-fix.patch.gz
          echo '5f3798e82f27422d18faff12c16e3f6ad25e04ccb413b6f824c7f12ceae536b7  /tmp/issue128-windows-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue128-windows-fix.patch.gz > /tmp/issue128-windows-fix.patch
          echo '609a22386750ede1e8fee2916eb96872e8d87d09c2817dcbc22786594440657c  /tmp/issue128-windows-fix.patch' | sha256sum -c -
      - name: Apply one Windows fix commit to final branch
        shell: bash
        run: |
          git fetch origin issue-128-profile-advancement
          git checkout -B issue-128-profile-advancement origin/issue-128-profile-advancement
          git apply --index /tmp/issue128-windows-fix.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize Profile manifest pins across line endings'
          git push origin HEAD:issue-128-profile-advancement
