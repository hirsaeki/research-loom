name: issue128-apply-staged-patch

on:
  push:
    branches: [issue-128-profile-advancement-staging]
    paths:
      - '.issue128-payload/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reconstruct and verify batched Kody fix patch
        shell: bash
        run: |
          base64 -d .issue128-payload/kody-fix.b64 > /tmp/issue128-kody-fix.patch.gz
          echo '3fcb93fa47a16df8c9cc7cd65f9e8d0584d05db1d92728fd30d624ebe209b145  /tmp/issue128-kody-fix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/issue128-kody-fix.patch.gz > /tmp/issue128-kody-fix.patch
          echo '62f7a2372d27bfebe7f40c93e4e9e55313cfcf95f4cdbffa49a463ee6522a788  /tmp/issue128-kody-fix.patch' | sha256sum -c -
      - name: Apply one batched Kody fix commit to final branch
        shell: bash
        run: |
          git fetch origin issue-128-profile-advancement
          git checkout -B issue-128-profile-advancement origin/issue-128-profile-advancement
          git apply --index /tmp/issue128-kody-fix.patch
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Address Kody profile advancement review'
          git push origin HEAD:issue-128-profile-advancement
