name: issue80-round7-staging
on:
  push:
    branches: [tmp/issue80-round7]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
      - name: Apply reviewed test patch
        shell: bash
        run: |
          base64 -d .issue80-r7.patch.gz.b64 | gzip -d > /tmp/issue80-r7.patch
          git apply --check /tmp/issue80-r7.patch
          git apply /tmp/issue80-r7.patch
      - name: Sync locked Python environment
        run: uv sync --frozen
      - name: Run Issue 80 acceptance
        run: uv run python -m unittest discover -s tests/runtime -p 'test_issue80_writer_composition.py'
      - name: Run Writer contracts
        run: uv run python -m unittest discover -s tests/contracts -p 'test_writer_publication*.py'
      - name: Run focused Research Package regressions
        env:
          PYTHONPATH: tests/runtime
        run: |
          uv run python -m unittest test_research_package_completion_review test_research_package_body_metadata_review test_research_package_review_fixes
      - name: Check diff
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "tests/runtime/test_issue80_writer_composition.py"
          test "$(grep -c '^    def test_' tests/runtime/test_issue80_writer_composition.py)" -eq 19
      - name: Commit validated test diff
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/runtime/test_issue80_writer_composition.py
          git commit -m 'Complete Writer R6 acceptance evidence'
          git push origin HEAD:tmp/issue80-round7
