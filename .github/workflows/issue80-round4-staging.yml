name: issue80-round4-staging
on:
  push:
    branches: ["tmp/issue80-kody-round4"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply Issue 80 review round 4 fix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .issue80-round4.patch.gz.b64 | gzip -d > .issue80-round4.patch
          git apply .issue80-round4.patch
          rm -f .issue80-round4.patch .issue80-round4.patch.gz.b64 .github/workflows/issue80-round4-staging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete Writer section-input review boundaries"
          git push
