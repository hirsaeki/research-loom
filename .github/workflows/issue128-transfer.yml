name: issue128-transfer

on:
  push:
    branches: [issue-128-profile-advancement-staging]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == 'hirsaeki'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply validated Issue 128 patch
        shell: bash
        run: |
          cat .issue128-transfer/part-*.patch > /tmp/issue128.patch
          git apply --check /tmp/issue128.patch
          git apply /tmp/issue128.patch
          rm -rf .issue128-transfer
          rm .github/workflows/issue128-transfer.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize Issue 128 implementation tree'
          git push origin HEAD:issue-128-profile-advancement-staging
