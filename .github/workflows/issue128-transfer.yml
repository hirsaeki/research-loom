name: issue128-transfer

on:
  push:
    branches: [issue-128-profile-advancement-staging]

permissions:
  contents: write

jobs:
  materialize-followup:
    if: github.actor == 'hirsaeki'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: transfer
      - name: Checkout materialized PR tree
        uses: actions/checkout@v5
        with:
          ref: issue-128-review2-materialized
          persist-credentials: true
          fetch-depth: 0
          path: work
      - name: Materialize sandbox Kody follow-up tree
        shell: bash
        run: |
          cd work
          git apply --check ../transfer/.issue128-transfer/followup.patch
          git apply ../transfer/.issue128-transfer/followup.patch
          git diff --check
          expected=$'plugins/local_application/application.py\ntests/runtime/test_profile_generation_advancement_attention.py'
          actual="$(git diff --name-only)"
          [[ "$actual" == "$expected" ]]
          git add -A
          git config user.name 'sandbox-transfer'
          git config user.email 'sandbox-transfer@invalid'
          git commit -m 'Materialize Issue 128 Kody follow-up tree'
          git push origin HEAD:issue-128-review2-materialized
