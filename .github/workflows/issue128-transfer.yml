name: issue128-transfer

on:
  push:
    branches: [issue-128-profile-advancement-staging]

permissions:
  contents: write

jobs:
  materialize-followup:
    if: github.actor == 'hirsaeki'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: transfer
      - name: Stop until follow-up patch exists
        id: payload
        shell: bash
        run: |
          if [[ -f transfer/.issue128-transfer/followup.patch ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout PR head
        if: steps.payload.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          ref: issue-128-profile-advancement
          persist-credentials: true
          fetch-depth: 0
          path: work
      - name: Materialize sandbox follow-up tree
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cd work
          git apply --check ../transfer/.issue128-transfer/followup.patch
          git apply ../transfer/.issue128-transfer/followup.patch
          git diff --check
          expected=$'plugins/local_application/application.py\nplugins/local_application/profile_advancement.py\ntests/runtime/test_profile_generation_advancement.py\ntests/runtime/test_profile_generation_advancement_attention.py'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$(printf '%s\n' "$expected" | sort)" ]]
          git add -A
          git config user.name 'sandbox-transfer'
          git config user.email 'sandbox-transfer@invalid'
          git commit -m 'Materialize Issue 128 follow-up tree'
          git push origin HEAD:issue-128-review2-materialized
