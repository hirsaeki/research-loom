name: issue128-transfer

on:
  push:
    branches: [issue-128-profile-advancement-staging]

permissions:
  contents: read

jobs:
  materialize:
    if: github.actor == 'hirsaeki'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Materialize validated Issue 128 patch without pushing
        shell: bash
        run: |
          cat .issue128-transfer/part-*.patch > /tmp/issue128.patch
          git apply --check /tmp/issue128.patch
          git apply /tmp/issue128.patch
          rm -rf .issue128-transfer
          rm .github/workflows/issue128-transfer.yml
          git add -A
          git config user.name 'sandbox-transfer'
          git config user.email 'sandbox-transfer@invalid'
          git commit -m 'Materialize Issue 128 implementation tree'
          git bundle create /tmp/issue128-materialized.bundle --all
      - name: Upload materialized git bundle
        uses: actions/upload-artifact@v4
        with:
          name: issue128-materialized-bundle
          path: /tmp/issue128-materialized.bundle
          if-no-files-found: error
