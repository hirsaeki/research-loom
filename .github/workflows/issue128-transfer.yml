name: issue128-transfer

on:
  push:
    branches: [issue-128-profile-advancement-staging]

permissions:
  contents: write

jobs:
  materialize-review2:
    if: github.actor == 'hirsaeki'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: transfer
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: issue-128-profile-advancement
          persist-credentials: true
          fetch-depth: 0
          path: work
      - name: Materialize sandbox review fix
        shell: bash
        run: |
          cd work
          git apply --check ../transfer/.issue128-transfer/kody2.patch
          git apply ../transfer/.issue128-transfer/kody2.patch
          git diff --check
          git add plugins/local_application/facade.py \
                  plugins/local_application/profile_advancement.py \
                  plugins/local_application/profile_resolution.py \
                  plugins/local_application/workspace.py \
                  tests/runtime/test_profile_generation_advancement.py
          git config user.name 'sandbox-transfer'
          git config user.email 'sandbox-transfer@invalid'
          git commit -m 'Materialize Kody follow-up fix tree'
          git push origin HEAD:issue-128-review2-materialized
