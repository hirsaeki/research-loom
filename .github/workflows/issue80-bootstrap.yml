name: issue80-bootstrap

on:
  push:
    branches:
      - issue-80-upload-staging

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged Issue 80 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .issue80-payload2.part-* | base64 -d > /tmp/issue80.tar.gz
          tar -xzf /tmp/issue80.tar.gz
          rm -f .issue80-payload.part-* .issue80-payload2.part-* .github/workflows/issue80-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implement versioned evidence-linked writer composition"
          git push
