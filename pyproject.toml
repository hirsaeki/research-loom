[project]
name = "research-loom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.25.1",
    "PyYAML==6.0.2",
    "rfc8785==0.1.4",
    "rfc3339-validator==0.1.4",
    "pypdf>=6.20.1",
]

[project.scripts]
research-loom = "plugins.local_application.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.uv]
# Runtime provisioning (`uv sync --frozen`) stays runtime-only; developer tools need `--group dev`.
default-groups = []

# `core` and `plugins` are namespace packages installed in editable mode from the repository root.
# They read Profiles, Project Configs and Core contracts from the checkout (core/resources.py),
# so a standalone wheel without the repository is not a supported install.
[tool.uv.build-backend]
module-root = ""
module-name = ["core", "plugins"]
namespace = true

[tool.ruff]
target-version = "py312"
line-length = 100
# Legacy reference trees are frozen pending removal (#500).
extend-exclude = ["docs/migration/misco-legacy-sources"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is owned by the formatter; long literals are left as written
    "B023",  # closures here are invoked within the loop iteration that defines them
    "UP031",  # %-format specifiers render publication text; rewriting them risks output drift
    "UP042",  # StrEnum changes str()/format() of persisted enum values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F403", "F405",  # shared runtime fixtures are star-imported
    "B017",  # some tests intentionally assert any failure from a fail-closed boundary
]
# Fixture hubs re-export helpers to star-importing test modules.
"tests/runtime/runtime_fixtures.py" = ["F401"]
"tests/runtime/survey_virtual_runner_test_support.py" = ["F401"]
"scripts/verify_misco_word_fixture.py" = ["E402"]  # imports after sys.path setup

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
files = ["core", "plugins/_infra"]
strict = true
